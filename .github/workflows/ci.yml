name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: go test -race ./...
      - run: go vet ./...
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: docker run --rm --user 0 --mount type=bind,source="$PWD",target=/workspace,readonly golang:1.25-bookworm bash /workspace/scripts/test-install.sh
      - run: go build -o .cache/prismflow ./cmd/prismflow
      - run: .cache/prismflow install-core --output .cache/mihomo
      - run: MIHOMO_BINARY="$PWD/.cache/mihomo" go test ./internal/core -run Integration -v
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
