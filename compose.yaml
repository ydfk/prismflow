services:
  prismflow:
    image: ${PRISMFLOW_IMAGE:-ydfk/prismflow:latest}
    restart: unless-stopped
    network_mode: host
    environment:
      PRISMFLOW_DATA: /data
      PRISMFLOW_CORE: /usr/local/bin/mihomo
      PRISMFLOW_LISTEN: 127.0.0.1:8080
      PRISMFLOW_PUBLIC_LISTEN: 127.0.0.1:8081
      PRISMFLOW_ORIGIN: ${PRISMFLOW_ORIGIN:-}
    volumes:
      - prismflow-data:/data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
volumes:
  prismflow-data:
